name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xlnc_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: xlnc_platform
      POSTGRES_TEST_DB: xlnc_platform_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (fail on high/critical)
        run: npm audit --audit-level=high

      - name: Build all workspaces
        run: npm run build

      - name: Create dedicated test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE ${{ env.POSTGRES_TEST_DB }};"

      - name: Apply migrations
        run: npm run migrate --workspace=@xlnc/database

      - name: Run full test suite (unit + real-Postgres integration)
        run: npm test

      - name: Re-run migrations to assert idempotency
        run: |
          output=$(npm run migrate --workspace=@xlnc/database)
          echo "$output"
          if ! echo "$output" | grep -q '\[migrate\] applied: (none)'; then
            echo "::error::Second migration run applied something new — migrations are not idempotent."
            exit 1
          fi
